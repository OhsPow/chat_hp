<body>

    <header>
        <nav>
            <ul>
                <li><a href="index.html">HOME</a></li>
                <li><a href="research.html">研究テーマ</a></li>

                <li><a href="resources.html">資料一覧</a></li>
            </ul>
        </nav>
    </header>

    <section id="welcome-section">
            <h1>苫小牧工業高等専門学校　電力知能研究室へようこそ</h1>
            <p>次世代の電力システムや電力システムへの知能技術の応用に関する研究に取り組んでいます。</p>
            <img src="images/logo_3.png" alt="Logo">
    </section>

 <section id="latest-news">
    <h2>最新ニュース</h2>
    <ul id="news-list"></ul>
    <p><a href="news.html">ニュース一覧を見る</a></p>
</section>

<script>
    fetch('sandbox_v2/content/news.json')
        .then(response => response.json())
        .then(data => {
            const newsArray = (data.items || [])
                .filter((item) => item.status === 'published')
                .sort((a, b) => new Date(b.date) - new Date(a.date));

            const newsList = document.getElementById('news-list');
            if (!newsArray.length) {
                newsList.innerHTML = '<li>公開中のニュースはありません。</li>';
                return;
            }

            newsArray.slice(0, 3).forEach(news => {
                const listItem = document.createElement('li');
                listItem.innerHTML = `<strong>${news.date}</strong> - ${news.title}`;
                newsList.appendChild(listItem);
            });
        })
        .catch(error => {
            console.error('ニュースデータの取得に失敗しました:', error);
            document.getElementById('news-list').innerHTML = '<li>ニュースの読み込みに失敗しました。</li>';
        });
</script>

    <footer>
        <p>&copy; 苫小牧高専　電力知能研究室</p>
    </footer>

</body>
</html>
