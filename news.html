<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>News - 研究室ホームページ</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header>
        <nav>
            <ul>
                <li><a href="index.html">HOME</a></li>
                <li><a href="research.html">研究テーマ</a></li>
                <li><a href="members.html">メンバー</a></li>
                <li><a href="publications.html">研究業績</a></li>
                <li><a href="access.html">アクセス</a></li>
                <li><a href="news.html">News</a></li>
                <li><a href="resources.html">資料一覧</a></li>
            </ul>
        </nav>
    </header>

    <section id="all-news">
        <h2>News</h2>
        <p>最新のニュースやイベント情報を掲載します。</p>
        <div id="news-container"></div>
    </section>

    <script>
        fetch('sandbox_v2/content/news.json')
            .then((response) => response.json())
            .then((data) => {
                const container = document.getElementById('news-container');
                const items = (data.items || [])
                    .filter((item) => item.status === 'published')
                    .sort((a, b) => new Date(b.date) - new Date(a.date));

                if (!items.length) {
                    container.innerHTML = '<p>公開中のニュースはありません。</p>';
                    return;
                }

                container.innerHTML = items.map((item) => `
                    <article data-date="${item.date}">
                        <h3>${item.title}</h3>
                        <p>${item.date}<br>${item.body || ''}${item.link ? `<br><a href="${item.link}">関連リンク</a>` : ''}</p>
                    </article>
                `).join('');
            })
            .catch((error) => {
                console.error('ニュースデータの取得に失敗しました:', error);
                document.getElementById('news-container').innerHTML = '<p>ニュースの読み込みに失敗しました。</p>';
            });
    </script>

    <footer>
        <p>&copy; 苫小牧高専　電力知能研究室</p>
    </footer>

</body>
</html>
